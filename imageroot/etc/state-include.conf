#
# maubot state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
# Only lines starting with "state/" or "volumes/" are considered by NS8.
#

# Admin password, token secret and homeservers; config/maubot.yaml is
# rendered from it by configure-module.
state/maubot.json

# Uploaded plugin files (.mbp).
volumes/maubot-data/plugins
# module-dump-state writes consistent copies of maubot.db and the plugin
# instance databases (dbs/*.db) here; restore-module puts them back.
volumes/maubot-data/.backup-snapshot
